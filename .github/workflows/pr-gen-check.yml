name: Run code generation check

on:
  pull_request:
    branches: 'develop'
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'names/**'
      - 'internal/generate/**'
      - 'tools/**'
    types:
      - opened
      - synchronize

jobs:
  code-generation-check:
    runs-on: ubuntu-22.04
    steps:
    - name: Setup Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.21.x

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Check code generation
      run: make gen

    - name: Check diff
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "::error::Code generation produced changes. Please run 'make gen' and commit the changes."
          git status --short
          exit 1
        fi
